# .github/workflows/backup.yml
name: Backup candles to MEGA

on:
  push:
    branches:
      - main
      - master

  schedule:
    # 17:00 IST (Asia/Kolkata) every day.
    - cron: "30 11 * * *"

  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note for manual runs"
        required: false
        default: "manual"
      intraday_test_mode:
        description: "Run the intraday fetch outside market hours? (true/false)"
        required: true
        default: "true"

concurrency:
  group: candle-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Fetch candles and back up to MEGA
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write .env
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
          MEGA_BACKUP_FOLDER_OVERRIDE: ${{ vars.MEGA_BACKUP_FOLDER }}
          MONGO_DB_NAME_OVERRIDE: ${{ vars.MONGO_DB_NAME }}
          MONGO_MAX_BLOB_MB_OVERRIDE: ${{ vars.MONGO_MAX_BLOB_MB }}
          # Optional override — leave unset to use data/all_instruments.json
          ALL_INSTRUMENTS_FILE_OVERRIDE: ${{ vars.ALL_INSTRUMENTS_FILE }}
          NIFTY_STRIKE_RANGE_POINTS_OVERRIDE: ${{ vars.NIFTY_STRIKE_RANGE_POINTS }}
          SENSEX_STRIKE_RANGE_POINTS_OVERRIDE: ${{ vars.SENSEX_STRIKE_RANGE_POINTS }}
          NIFTY_STRIKE_ROUNDING_OVERRIDE: ${{ vars.NIFTY_STRIKE_ROUNDING }}
          SENSEX_STRIKE_ROUNDING_OVERRIDE: ${{ vars.SENSEX_STRIKE_ROUNDING }}
          STRIKE_RANGE_MODE_CUTOFF_TIME_OVERRIDE: ${{ vars.STRIKE_RANGE_MODE_CUTOFF_TIME }}
          NIFTY_STRIKE_MIN_OVERRIDE: ${{ vars.NIFTY_STRIKE_MIN }}
          NIFTY_STRIKE_MAX_OVERRIDE: ${{ vars.NIFTY_STRIKE_MAX }}
          SENSEX_STRIKE_MIN_OVERRIDE: ${{ vars.SENSEX_STRIKE_MIN }}
          SENSEX_STRIKE_MAX_OVERRIDE: ${{ vars.SENSEX_STRIKE_MAX }}
          EMA_FAST_PERIOD_OVERRIDE: ${{ vars.EMA_FAST_PERIOD }}
          EMA_SLOW_PERIOD_OVERRIDE: ${{ vars.EMA_SLOW_PERIOD }}
          SR_ENABLED_OVERRIDE: ${{ vars.SR_ENABLED }}
          SR_LEFT_BARS_OVERRIDE: ${{ vars.SR_LEFT_BARS }}
          SR_RIGHT_BARS_OVERRIDE: ${{ vars.SR_RIGHT_BARS }}
          INTRADAY_TEST_MODE: ${{ github.event.inputs.intraday_test_mode || 'true' }}
        run: |
          : "${MEGA_EMAIL:?MEGA_EMAIL secret is required}"
          : "${MEGA_PASSWORD:?MEGA_PASSWORD secret is required}"

          MEGA_BACKUP_FOLDER="${MEGA_BACKUP_FOLDER_OVERRIDE:-novag7_candles_backup}"
          MONGO_DB_NAME="${MONGO_DB_NAME_OVERRIDE:-UPSTOX_APP_V2}"
          MONGO_MAX_BLOB_MB="${MONGO_MAX_BLOB_MB_OVERRIDE:-15}"

          ALL_INSTRUMENTS_LINE=""
          if [ -n "${ALL_INSTRUMENTS_FILE_OVERRIDE}" ]; then
            ALL_INSTRUMENTS_LINE="ALL_INSTRUMENTS_FILE=${ALL_INSTRUMENTS_FILE_OVERRIDE}"
          fi

          NIFTY_STRIKE_RANGE_POINTS="${NIFTY_STRIKE_RANGE_POINTS_OVERRIDE:-500}"
          SENSEX_STRIKE_RANGE_POINTS="${SENSEX_STRIKE_RANGE_POINTS_OVERRIDE:-1000}"
          NIFTY_STRIKE_ROUNDING="${NIFTY_STRIKE_ROUNDING_OVERRIDE:-50}"
          SENSEX_STRIKE_ROUNDING="${SENSEX_STRIKE_ROUNDING_OVERRIDE:-100}"
          STRIKE_RANGE_MODE_CUTOFF_TIME="${STRIKE_RANGE_MODE_CUTOFF_TIME_OVERRIDE:-10:00}"

          NIFTY_STRIKE_MIN="${NIFTY_STRIKE_MIN_OVERRIDE:-21000}"
          NIFTY_STRIKE_MAX="${NIFTY_STRIKE_MAX_OVERRIDE:-26000}"
          SENSEX_STRIKE_MIN="${SENSEX_STRIKE_MIN_OVERRIDE:-71000}"
          SENSEX_STRIKE_MAX="${SENSEX_STRIKE_MAX_OVERRIDE:-73000}"

          EMA_FAST_PERIOD="${EMA_FAST_PERIOD_OVERRIDE:-9}"
          EMA_SLOW_PERIOD="${EMA_SLOW_PERIOD_OVERRIDE:-21}"

          SR_ENABLED="${SR_ENABLED_OVERRIDE:-true}"
          SR_LEFT_BARS="${SR_LEFT_BARS_OVERRIDE:-15}"
          SR_RIGHT_BARS="${SR_RIGHT_BARS_OVERRIDE:-15}"

          if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            TELEGRAM_ENABLED=true
          else
            TELEGRAM_ENABLED=false
          fi

          if [ -n "${MONGO_URL}" ]; then
            MONGO_ENABLED=true
          else
            MONGO_ENABLED=false
          fi

          cat > .env <<EOF
          REQUEST_TIMEOUT_SECONDS=30
          UPSTOX_REQUEST_TIMEOUT_SECONDS=60
          UPSTOX_CONNECT_TIMEOUT_SECONDS=10
          LOG_LEVEL=INFO
          LOG_FILE=logs/backup.log
          DATA_DIR=data
          HISTORY_LOOKBACK_DAYS=10
          HISTORY_MAX_CONCURRENCY=8
          HISTORY_STRICT_COMPLETENESS=true
          HISTORY_VERIFY_OVERLAP_DAYS=1
          MARKET_TIMEZONE=Asia/Kolkata
          MARKET_OPEN_TIME=09:15
          MARKET_CLOSE_TIME=15:40
          INTRADAY_TEST_MODE=${INTRADAY_TEST_MODE}
          INSTRUMENTS_URL=https://assets.upstox.com/market-quote/instruments/exchange/complete.json.gz
          INSTRUMENTS_CACHE_DIR=data/_cache
          ${ALL_INSTRUMENTS_LINE}
          NIFTY_UNDERLYING=NIFTY
          SENSEX_UNDERLYING=SENSEX
          NIFTY_INDEX_INSTRUMENT_KEY=NSE_INDEX|Nifty 50
          SENSEX_INDEX_INSTRUMENT_KEY=BSE_INDEX|SENSEX
          NIFTY_STRIKE_RANGE_POINTS=${NIFTY_STRIKE_RANGE_POINTS}
          SENSEX_STRIKE_RANGE_POINTS=${SENSEX_STRIKE_RANGE_POINTS}
          NIFTY_STRIKE_ROUNDING=${NIFTY_STRIKE_ROUNDING}
          SENSEX_STRIKE_ROUNDING=${SENSEX_STRIKE_ROUNDING}
          STRIKE_RANGE_MODE_CUTOFF_TIME=${STRIKE_RANGE_MODE_CUTOFF_TIME}
          NIFTY_STRIKE_MIN=${NIFTY_STRIKE_MIN}
          NIFTY_STRIKE_MAX=${NIFTY_STRIKE_MAX}
          SENSEX_STRIKE_MIN=${SENSEX_STRIKE_MIN}
          SENSEX_STRIKE_MAX=${SENSEX_STRIKE_MAX}
          EMA_FAST_PERIOD=${EMA_FAST_PERIOD}
          EMA_SLOW_PERIOD=${EMA_SLOW_PERIOD}
          SR_ENABLED=${SR_ENABLED}
          SR_LEFT_BARS=${SR_LEFT_BARS}
          SR_RIGHT_BARS=${SR_RIGHT_BARS}
          MEGA_ENABLED=true
          MEGA_EMAIL=${MEGA_EMAIL}
          MEGA_PASSWORD=${MEGA_PASSWORD}
          MEGA_BACKUP_FOLDER=${MEGA_BACKUP_FOLDER}
          TELEGRAM_ENABLED=${TELEGRAM_ENABLED}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          TELEGRAM_TIMEOUT_SECONDS=10
          MONGO_ENABLED=${MONGO_ENABLED}
          MONGO_URL=${MONGO_URL}
          MONGO_DB_NAME=${MONGO_DB_NAME}
          MONGO_METADATA_COLLECTION=app_tokens
          MONGO_METADATA_DOC_ID=backup_candles
          MONGO_BLOB_COLLECTION=backup_collection
          MONGO_BLOB_DOC_ID=backup_historical_candles
          MONGO_MAX_BLOB_MB=${MONGO_MAX_BLOB_MB}
          MONGO_TIMEOUT_MS=10000
          EOF

          echo "Wrote .env"
          echo "MEGA_BACKUP_FOLDER=${MEGA_BACKUP_FOLDER}"
          echo "STRIKE_RANGE_MODE_CUTOFF_TIME=${STRIKE_RANGE_MODE_CUTOFF_TIME} IST"
          echo "NIFTY dynamic strike: ±${NIFTY_STRIKE_RANGE_POINTS} (round ${NIFTY_STRIKE_ROUNDING})"
          echo "SENSEX dynamic strike: ±${SENSEX_STRIKE_RANGE_POINTS} (round ${SENSEX_STRIKE_ROUNDING})"
          echo "NIFTY fallback range=${NIFTY_STRIKE_MIN}..${NIFTY_STRIKE_MAX}"
          echo "SENSEX fallback range=${SENSEX_STRIKE_MIN}..${SENSEX_STRIKE_MAX}"
          echo "EMA_FAST=${EMA_FAST_PERIOD} EMA_SLOW=${EMA_SLOW_PERIOD}"
          echo "SR_ENABLED=${SR_ENABLED} SR_LEFT_BARS=${SR_LEFT_BARS} SR_RIGHT_BARS=${SR_RIGHT_BARS}"
          echo "TELEGRAM_ENABLED=${TELEGRAM_ENABLED}"
          echo "MONGO_ENABLED=${MONGO_ENABLED}"
          echo "MONGO_DB_NAME=${MONGO_DB_NAME}"
          if [ -n "${ALL_INSTRUMENTS_FILE_OVERRIDE}" ]; then
            echo "ALL_INSTRUMENTS_FILE=${ALL_INSTRUMENTS_FILE_OVERRIDE}"
          else
            echo "ALL_INSTRUMENTS_FILE=default (<DATA_DIR>/all_instruments.json = data/all_instruments.json)"
          fi

      - name: Fetch candles and upload to MEGA
        run: python -m candle_backup

      - name: Show data summary
        if: always()
        run: |
          echo "Data directory size:"
          du -sh data/ || true
          echo "File count:"
          find data/ -type f | wc -l || true
          echo "Strike-range log lines (window / mode / candle_ts):"
          grep -E "\[STRIKE-RANGE\]" logs/backup.log 2>/dev/null || true
          echo "SR level job log lines:"
          grep -E "SR level job completed|SR level update" logs/backup.log 2>/dev/null | tail -20 || true
          echo "Index folders:"
          ls -R data/index 2>/dev/null | head -50 || true
          echo "Options folders:"
          ls -R data/nifty data/sensex 2>/dev/null | head -50 || true
          echo "all_instruments.json (inside data/):"
          ls -la data/all_instruments.json 2>/dev/null || echo "(not written this run)"
          echo "SR level files (first 20):"
          find data -name 'sr_levels.json' -type f 2>/dev/null | head -20 || true
          echo "SR level file count:"
          find data -name 'sr_levels.json' -type f 2>/dev/null | wc -l || true

      - name: Verify all_instruments.json
        if: always()
        run: |
          ALL_JSON="data/all_instruments.json"
          echo "Verifying ${ALL_JSON}:"
          ls -la "$ALL_JSON" 2>/dev/null || echo "(not written this run)"
          if [ -f "$ALL_JSON" ]; then
            python - <<'PY'
          import json, sys
          p = "data/all_instruments.json"
          try:
              data = json.load(open(p, encoding="utf-8"))
          except Exception as e:
              print(f"FAILED to parse {p}: {e}")
              sys.exit(0)
          total = len(data)
          idx = sum(1 for v in data.values()
                    if str(v.get("strike_type") or "").upper() == "INDEX")
          opt = total - idx
          print(f"Entries total={total} indices={idx} options={opt}")
          if idx > 0 and opt == 0:
              print("::warning::all_instruments.json contains ONLY index rows "
                    "(no option contracts). Check the STRIKE-RANGE fallbacks.")
          else:
              print("OK — all_instruments.json contains option contracts.")
          for i, (k, v) in enumerate(list(data.items())[:5]):
              print(f"  sample[{i}] {k} -> {v.get('strike_type')} "
                    f"expiry={v.get('expiry')} "
                    f"relative_path={v.get('relative_path')}")
          PY
          fi

      - name: Verify sr_levels.json (sample)
        if: always()
        run: |
          SAMPLE="$(find data -name 'sr_levels.json' -type f 2>/dev/null | head -1)"
          if [ -z "$SAMPLE" ]; then
            echo "(no sr_levels.json files written this run)"
            exit 0
          fi
          echo "Verifying sample SR file: ${SAMPLE}"
          ls -la "$SAMPLE"
          python - "$SAMPLE" <<'PY'
          import json, sys
          p = sys.argv[1]
          try:
              doc = json.load(open(p, encoding="utf-8"))
          except Exception as e:
              print(f"FAILED to parse {p}: {e}")
              sys.exit(0)
          if isinstance(doc, dict):
              levels = doc.get("levels") or []
              print(f"count={doc.get('count')} "
                    f"left_bars={doc.get('left_bars')} "
                    f"right_bars={doc.get('right_bars')} "
                    f"relative_path={doc.get('relative_path')}")
          else:
              levels = doc
              print("legacy list format")
          total = len(levels)
          sup = sum(1 for r in levels if r.get("level") == "support")
          res = total - sup
          print(f"entries total={total} support={sup} resistance={res}")
          for i, r in enumerate(levels[:3]):
              print(f"  sample[{i}] level={r.get('level')} "
                    f"price={r.get('price')} "
                    f"confirmed_time={r.get('confirmed_time')}")
          PY

      - name: Verify relative_path fields
        if: always()
        run: |
          echo "=== relative_path from a sample candles.json ==="
          SAMPLE_C="$(find data -name 'candles.json' -type f 2>/dev/null | head -1)"
          if [ -n "$SAMPLE_C" ]; then
            python - "$SAMPLE_C" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8")).get("relative_path"))
          PY
          else
            echo "(no candles.json files written this run)"
          fi

          echo "=== relative_path from a sample ema_crosses.json ==="
          SAMPLE_E="$(find data -name 'ema_crosses.json' -type f 2>/dev/null | head -1)"
          if [ -n "$SAMPLE_E" ]; then
            python - "$SAMPLE_E" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8")).get("relative_path"))
          PY
          else
            echo "(no ema_crosses.json files written this run)"
          fi

          echo "=== relative_path from a sample sr_levels.json ==="
          SAMPLE_S="$(find data -name 'sr_levels.json' -type f 2>/dev/null | head -1)"
          if [ -n "$SAMPLE_S" ]; then
            python - "$SAMPLE_S" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8")).get("relative_path"))
          PY
          else
            echo "(no sr_levels.json files written this run)"
          fi

          echo "=== relative_path from all_instruments.json (first 3 records) ==="
          if [ -f data/all_instruments.json ]; then
            python - data/all_instruments.json <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          for i, (k, v) in enumerate(list(doc.items())[:3]):
              print(f"  {k} -> {v.get('relative_path')}")
          PY
          else
            echo "(all_instruments.json not written this run)"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore